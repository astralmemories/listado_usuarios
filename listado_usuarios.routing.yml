listado_usuarios.listado_usuarios_page:
  path: '/listado-usuarios'
  defaults:
    _title: 'Listado de Usuarios'
    _form: '\Drupal\listado_usuarios\Form\ListadoUsuariosForm'
  requirements:
    _permission: 'access content'

# Settings form route.
listado_usuarios.settings:
  path: '/admin/config/system/listado_usuarios'
  defaults:
    _title: 'Configuración Listado de Usuarios'
    _form: 'Drupal\listado_usuarios\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'
